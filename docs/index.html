<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#041910" />
  <title>Business Camp — Идут технические работы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23041910'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='26' font-family='Arial' font-weight='700' fill='%23c8ff3d'%3EBC%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #041910;
      --lime: #c8ff3d;
      --white: #f4f7f0;
      --muted: rgba(244, 247, 240, 0.72);
      --font-d: "Unbounded", sans-serif;
      --font-b: "Manrope", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      font-family: var(--font-b);
      color: var(--white);
      background:
        radial-gradient(900px 480px at 80% -10%, rgba(200, 255, 61, 0.1), transparent 55%),
        radial-gradient(700px 420px at 0% 80%, rgba(10, 61, 46, 0.55), transparent 60%),
        linear-gradient(180deg, #02140e, var(--bg) 40%, #053022 100%);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    .wrap {
      width: min(560px, 100%);
      text-align: center;
      animation: rise 0.8s var(--ease) both;
    }
    .brand {
      font-family: var(--font-d);
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      margin: 0 0 1.6rem;
    }
    .brand span { color: var(--lime); }
    h1 {
      font-family: var(--font-d);
      font-size: clamp(1.55rem, 5vw, 2.35rem);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 0.85rem;
    }
    p {
      margin: 0 auto;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    .pulse {
      width: 3.25rem;
      height: 3.25rem;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      border: 2px solid rgba(200, 255, 61, 0.35);
      display: grid;
      place-items: center;
      position: relative;
    }
    .pulse::before {
      content: "";
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: var(--lime);
      animation: blink 1.6s ease-in-out infinite;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(200, 255, 61, 0.45);
      animation: ring 1.6s ease-out infinite;
    }
    .wa {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 1.75rem;
      padding: 0.85rem 1.25rem;
      border-radius: 999px;
      background: var(--lime);
      color: #041910;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.25s var(--ease), filter 0.25s;
    }
    .wa:hover { transform: translateY(-2px); filter: brightness(1.05); }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes ring {
      0% { opacity: 0.7; transform: scale(0.85); }
      100% { opacity: 0; transform: scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wrap, .pulse::before, .pulse::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="brand">BUSINESS <span>CAMP</span></p>
    <div class="pulse" aria-hidden="true"></div>
    <h1>Идут технические работы</h1>
    <p>Сайт временно закрыт. Мы скоро вернёмся.</p>
    <a class="wa" href="https://wa.me/992982947777" target="_blank" rel="noopener noreferrer">
      Написать в WhatsApp
    </a>
  </main>
</body>
</html>
